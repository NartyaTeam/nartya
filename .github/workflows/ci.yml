name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit des dépendances de production
        run: npm run security:audit
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm run test:unit
      - name: Build front (Vite)
        run: npm run build

  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build front (embarqué dans la coque)
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests Rust (cœur et coque)
        run: cargo test --workspace
      - name: Build de la coque
        run: cargo build -p nartya
      - name: Installeur Windows (NSIS)
        run: npm run tauri:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nartya-tauri-windows
          path: release/tauri/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (build web nécessaire à cap sync)
        run: npm ci
      - name: Build front (assets embarqués dans le shell Android)
        run: npm run build
      - uses: android-actions/setup-android@v3
        with:
          # Le paquet `tools`, défaut de l'action, n'existe plus dans les cmdline-tools récents.
          packages: platform-tools
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Lint Android
        working-directory: android
        run: ./gradlew lintDebug --console=plain
      - name: Tests unitaires Android
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests du paquet Swift (proxy et téléchargements)
        run: swift test --package-path ios/NartyaNative
