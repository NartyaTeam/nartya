name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .env est ignoré par git : sans lui, le front part sans Supabase et l'app reste sur un écran noir.
      - name: Config publique de l'instance
        shell: bash
        run: cp .env.example .env
      - name: Install
        run: npm ci
      - name: Audit des dépendances de production
        run: npm run security:audit
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm run test:unit
      - name: Build front (Vite)
        run: npm run build

  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .env est ignoré par git : sans lui, le front part sans Supabase et l'app reste sur un écran noir.
      - name: Config publique de l'instance
        shell: bash
        run: cp .env.example .env
      - name: Install
        run: npm ci
      - name: Build front (embarqué dans la coque)
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests Rust (cœur et coque)
        run: cargo test --workspace
      - name: Build de la coque
        run: cargo build -p nartya
      # .env est ignoré par git : sans lui, le front part sans Supabase et l'app reste sur un écran noir.
      - name: Config publique de l'instance
        shell: bash
        run: cp .env.example .env
      - name: Installeur Windows (NSIS)
        run: npm run tauri:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nartya-tauri-windows
          path: release/tauri/
          retention-days: 7

  # Linux et macOS, une machine native par architecture (ffmpeg et le nom du fichier suivent l'arch).
  tauri-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 épinglé sur 22.04 : la WebKitGTK embarquée dans l'AppImage hérite de la glibc du runner (ubuntu-latest exigeait glibc 2.43).
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest, name: mac-arm64 }
          - { os: macos-15-intel, name: mac-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      # .env est ignoré par git : sans lui, le front part sans Supabase et l'app reste sur un écran noir.
      - name: Config publique de l'instance
        shell: bash
        run: cp .env.example .env
      - name: Install
        run: npm ci
      - name: Build front (embarqué dans la coque)
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests Rust (cœur et coque)
        run: cargo test --workspace
      - name: Build de la coque
        run: cargo build -p nartya
      # .env est ignoré par git : sans lui, le front part sans Supabase et l'app reste sur un écran noir.
      - name: Config publique de l'instance
        shell: bash
        run: cp .env.example .env
      - name: Installeurs (.dmg ou AppImage et .deb)
        env:
          NO_STRIP: "true"
        run: npm run tauri:bundle
      - name: Contenu du .deb (ffmpeg livré ?)
        if: runner.os == 'Linux'
        run: dpkg -c release/tauri/*.deb | grep -i -E "ffmpeg|bin/" || true
      - uses: actions/upload-artifact@v4
        with:
          name: nartya-tauri-${{ matrix.name }}
          path: release/tauri/
          retention-days: 7

  # Le cœur Rust doit rester compilable pour Android (lien : docs/TAURI-MIGRATION.md).
  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Clippy du cœur et du pont JNI (arm64)
        run: cargo ndk -t arm64-v8a -P 24 clippy -p nartya-core -p nartya-android -- -D warnings

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # .env est ignoré par git : sans lui, le front part sans Supabase et l'app reste sur un écran noir.
      - name: Config publique de l'instance
        shell: bash
        run: cp .env.example .env
      - name: Install (build web nécessaire à cap sync)
        run: npm ci
      - name: Build front (assets embarqués dans le shell Android)
        run: npm run build
      - uses: android-actions/setup-android@v3
        with:
          # Le paquet `tools`, défaut de l'action, n'existe plus dans les cmdline-tools récents.
          packages: platform-tools
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Lint Android
        working-directory: android
        run: ./gradlew lintDebug --console=plain
      - name: Tests unitaires Android
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests du paquet Swift (proxy et téléchargements)
        run: swift test --package-path ios/NartyaNative
