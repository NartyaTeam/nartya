  /manga/{oeuvre}/chapters:
    get:
      tags: [Manga]
      operationId: getChapters
      summary: Chapitres d'une œuvre
      description: |
        `chapter` est le numéro à afficher, `folder` celui qui construit l'adresse des pages.
        Les deux diffèrent quand une œuvre commence par un prologue (`chapterOffset`). L'adresse
        d'une page est `{imageBase}/{oeuvre encodée}/{folder}/{page}.jpg`, pages à partir de 1.
      parameters:
        - $ref: "#/components/parameters/oeuvre"
      responses:
        "200":
          description: Les chapitres.
          content:
            application/json:
              example: {"data":{"oeuvre":"One Piece","imageBase":"https://anime.nartya.app/v1/manga/images","chapterOffset":0,"chapters":[{"folder":1,"chapter":1,"pages":57},{"folder":2,"chapter":2,"pages":25}]}}
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      oeuvre: { type: string, example: One Piece }
                      imageBase: { type: string, format: uri, example: "https://anime.nartya.app/v1/manga/images" }
                      chapterOffset: { type: integer, example: 0 }
                      chapters:
                        type: array
                        items:
                          type: object
                          properties:
                            folder: { type: integer, example: 1 }
                            chapter: { type: number, example: 1 }
                            pages: { type: integer, example: 57 }
        "400": { $ref: "#/components/responses/InvalidParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /manga/images/{oeuvre}/{folder}/{page}:
    get:
      tags: [Manga]
      operationId: getMangaPage
      summary: Page d'un chapitre
      description: Image d'une page. Sans authentification, car une balise `<img>` ne peut pas envoyer de jeton.
      security: []
      parameters:
        - $ref: "#/components/parameters/oeuvre"
        - { name: folder, in: path, required: true, schema: { type: integer, example: 1 } }
        - { name: page, in: path, required: true, description: "Numéro de page suivi de l'extension, à partir de 1.", schema: { type: string, example: 1.jpg } }
      responses:
        "200":
          description: L'image.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "400": { $ref: "#/components/responses/InvalidParam" }
        "404":
          description: Page introuvable.

  /sources/recipe:
    get:
      tags: [Lecture vidéo]
      operationId: getSourceRecipe
      security:
        - SessionApp: []
      summary: Table des hébergeurs
      description: |
        Table des hébergeurs et de la façon de lire leurs vidéos.

        **Accès** : session de l'application uniquement. Une clé d'API reçoit `403`, pour que
        l'API ne serve pas de résolveur de vidéos à des services tiers. En développement, elle
        fonctionne dès que vous êtes connecté dans l'app.
      responses:
        "200": { description: La table. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /streams/{id}:
    get:
      tags: [Lecture vidéo]
      operationId: openStream
      security:
        - SessionApp: []
      summary: Adresse d'une vidéo
      description: |
        Échange l'`id` d'un lecteur (voir « Épisodes d'une saison ») contre l'adresse de la
        vidéo. L'`id` expire quelques heures après avoir été servi : rechargez alors les
        épisodes. Plafond de 60 requêtes par minute.

        **Accès** : session de l'application uniquement, pour la même raison que
        `/sources/recipe`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: L'adresse.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      provider: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { $ref: "#/components/responses/Expired" }

  /profiles/{handle}/views:
    post:
      tags: [Compte]
      operationId: recordProfileView
      summary: Compter une vue de profil
      description: Compte une vue sur un profil public, une fois par visiteur et par période.
      security: []
      parameters:
        - { name: handle, in: path, required: true, description: Pseudo public., schema: { type: string } }
      responses:
        "200":
          description: Vue comptée ou déjà comptée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      counted: { type: boolean }
        "400": { $ref: "#/components/responses/InvalidParam" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/discord:
    post:
      tags: [Compte]
      operationId: syncDiscord
      security:
        - SessionApp: []
      summary: Synchroniser les visuels Discord
      description: |
        Synchronise l'avatar et la bannière Discord du compte connecté. `inspect-link` décrit
        les visuels disponibles sans rien modifier.

        **Accès** : session de l'application uniquement. Elle modifie le profil du compte
        connecté ; une clé d'API est en lecture seule.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [refresh-avatar, inspect-link, sync-profile]
                  default: refresh-avatar
                avatar: { type: boolean, description: "Avec `sync-profile` : importer l'avatar." }
                banner: { type: boolean, description: "Avec `sync-profile` : importer la bannière." }
      responses:
        "200": { description: Visuels synchronisés ou décrits. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /episode-thumbs:
    post:
      tags: [Compte]
      operationId: getEpisodeThumbs
      security:
        - SessionApp: []
      summary: Vignettes d'épisodes
      description: |
        Vignettes de 60 épisodes au plus par appel.

        **Accès** : session de l'application uniquement : la route met en cache les vignettes
        en base, et une clé d'API est en lecture seule. Pour un projet tiers, le champ `image`
        de « Épisodes d'une saison » donne la même vignette.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    properties:
                      slug: { type: string, example: gachiakuta }
                      season: { type: string, example: saison1 }
                      episode: { type: integer, example: 1 }
      responses:
        "200":
          description: Vignette de chaque épisode, indexée par `slug|season|episode`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: { type: [string, "null"], format: uri }
                    example: { "gachiakuta|saison1|1": "https://artworks.thetvdb.com/banners/v4/episode/10541264/screencap.jpg" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    CleAPI:
      type: http
      scheme: bearer
      bearerFormat: nk_…
      description: |
        Clé d'API créée dans **Paramètres → Clés d'API** de l'application (compte avec Discord
        lié). Lecture seule, sans lecture vidéo, 60 requêtes par minute.
    SessionApp:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton de session de l'application, envoyé automatiquement une fois connecté. Toutes les
        routes, 180 requêtes par minute. Voir « Session de l'application ».

  parameters:
    slug:
      name: slug
      in: path
      required: true
      description: Identifiant de l'anime.
      schema: { type: string, pattern: "^[a-zA-Z0-9._-]{1,100}$", example: gachiakuta }
    seasonId:
      name: seasonId
      in: path
      required: true
      description: Identifiant de la saison, lu dans `/anime/{slug}/seasons`.
      schema: { type: string, pattern: "^[a-zA-Z0-9_-]{1,60}$", example: saison1 }
    oeuvre:
      name: oeuvre
      in: path
      required: true
      description: Nom de l'œuvre tel que renvoyé par l'API, encodé pour l'URL.
      schema: { type: string, example: One Piece }
    page:
      name: page
      in: query
      description: Page, à partir de 1.
      schema: { type: integer, minimum: 1, maximum: 200, default: 1 }
    limit:
      name: limit
      in: query
      description: Nombre de résultats.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    InvalidParam:
      description: Paramètre absent ou mal formé.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_param, message: Slug invalide } }
    Unauthorized:
      description: Jeton absent ou invalide, clé révoquée.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "Authentification requise : session de l'app ou clé d'API." } }
    Forbidden:
      description: Compte suspendu, ou action interdite à une clé d'API.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: Les clés d'API sont en lecture seule. } }
    NotFound:
      description: Ressource inconnue.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Saison inconnue } }
    Expired:
      description: Jeton de lecture périmé.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: expired, message: "Lien expiré, recharge l'épisode." } }
    RateLimited:
      description: Trop de requêtes.
      headers:
        RateLimit-Limit: { schema: { type: integer }, description: Plafond de la fenêtre. }
        RateLimit-Remaining: { schema: { type: integer }, description: Requêtes restantes. }
        RateLimit-Reset: { schema: { type: integer }, description: Secondes avant la fin de la fenêtre. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "Trop de requêtes, réessaie plus tard." } }
    Unavailable:
      description: Filtre ou service momentanément indisponible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unavailable, message: Filtre par langue indisponible } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [invalid_param, unauthorized, forbidden, not_found, expired, rate_limited, internal, upstream_error, unavailable]
            message: { type: string }

    PageMeta:
      type: object
      properties:
        count: { type: integer, description: Nombre de résultats sur cette page. }
        page: { type: integer }

    TitleCard:
      type: object
      properties:
        slug: { type: string, example: naruto }
        title: { type: string, example: Naruto }
        image: { type: [string, "null"], format: uri }

    CatalogItem:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        image: { type: [string, "null"], format: uri }
        episodeCount: { type: integer, example: 12 }
        anilistId: { type: [integer, "null"], example: 21 }
        genres: { type: array, items: { type: string }, example: [Action] }
        type: { type: string, example: Anime }
        languages: { type: array, items: { type: string, enum: [vf, vostfr, va] } }

    MangaCard:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        image: { type: [string, "null"], format: uri }
        genres: { type: array, items: { type: string } }

    MediaCard:
      type: object
      description: Anime ou manga mis en avant, avec ses métadonnées AniList.
      properties:
        id: { type: [integer, string], description: Identifiant AniList. }
        slug: { type: string, example: re-zero }
        mediaType: { type: string, enum: [anime, manga], description: Présent sur l'accueil manga. }
        mangaAnilistId: { type: integer, description: Identifiant AniList du manga. }
        title: { type: string }
        titleNative: { type: [string, "null"] }
        titles: { type: array, items: { type: string }, description: "Titres connus, toutes langues." }
        cover: { type: string, format: uri }
        banner: { type: [string, "null"], format: uri }
        fanart: { type: [string, "null"], format: uri }
        clearLogo: { type: [string, "null"], format: uri, description: "Logo du titre, fond transparent." }
        azBanner: { type: [string, "null"], format: uri }
        color: { type: [string, "null"], example: "#e49350" }
        genres: { type: array, items: { type: string } }
        score: { type: [number, "null"], example: 9 }
        description: { type: [string, "null"], description: En anglais. }
        format: { type: [string, "null"], example: TV }
        status: { type: [string, "null"], example: FINISHED }
        countryOfOrigin: { type: [string, "null"], example: JP }
        episodes: { type: [integer, "null"] }
        chapters: { type: [integer, "null"] }
        volumes: { type: [integer, "null"] }
        year: { type: [integer, "null"] }
        nextEpisode:
          type: [object, "null"]
          description: Prochaine diffusion connue.
          properties:
            episode: { type: integer }
            airingAt: { type: integer, description: Horodatage en secondes. }

    Row:
      type: object
      properties:
        key: { type: string, example: trending }
        title: { type: string, example: Tendances }
        kana: { type: [string, "null"], example: 人気 }
        numbered: { type: boolean, description: Afficher un classement. }
        items: { type: array, items: { $ref: "#/components/schemas/MediaCard" } }

    Season:
      type: object
      properties:
        id: { type: string, example: saison1 }
        name: { type: string, example: Saison 1 }

    AnimePage:
      type: object
      properties:
        anime:
          type: object
          properties:
            slug: { type: string, example: gachiakuta }
            title: { type: string, example: Gachiakuta }
            alternativeTitles: { type: array, items: { type: string } }
            synopsis: { type: [string, "null"] }
            status: { type: [string, "null"], example: En cours }
            news: { type: [string, "null"], description: Annonce du catalogue (nouvelle saison…). }
            image: { type: [string, "null"], format: uri }
            url: { type: string, format: uri, description: Page de l'anime sur le site source. }
            mapping:
              type: object
              description: Identifiant AniList de chaque saison.
              additionalProperties: { type: [integer, array] }
              example: { saison1: 178025 }
            externalWatch:
              type: array
              description: Plateformes légales où regarder l'œuvre, quand elle n'a pas d'épisodes ici.
              items: { type: object }
        anilist:
          type: [object, "null"]
          description: Métadonnées AniList, `null` en mode allégé.
          properties:
            id: { type: integer, example: 178025 }
            mediaType: { type: string, example: ANIME }
            title: { type: string }
            titleNative: { type: [string, "null"] }
            description: { type: [string, "null"] }
            cover: { type: [string, "null"], format: uri }
            banner: { type: [string, "null"], format: uri }
            countryOfOrigin: { type: [string, "null"], example: JP }
            chapters: { type: [integer, "null"] }
            volumes: { type: [integer, "null"] }
            relations:
              type: array
              description: Œuvres liées (source, suite…).
              items:
                type: object
                properties:
                  id: { type: integer }
                  type: { type: string, example: MANGA }
                  title: { type: string }
                  format: { type: [string, "null"] }
                  relationType: { type: string, example: SOURCE }
            genres: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
            score: { type: [number, "null"] }
            format: { type: [string, "null"] }
            status: { type: [string, "null"] }
            episodes: { type: [integer, "null"] }
            year: { type: [integer, "null"] }
            studios: { type: array, items: { type: string } }
            trailer:
              type: [object, "null"]
              properties:
                id: { type: string }
                site: { type: string, example: youtube }
        images:
          type: [object, "null"]
          properties:
            banner: { type: [string, "null"], format: uri }
            fanart: { type: [string, "null"], format: uri }
            poster: { type: [string, "null"], format: uri }
            clearLogo: { type: [string, "null"], format: uri }
        seasons: { type: array, items: { $ref: "#/components/schemas/Season" } }
        seasonsCount: { type: integer }
        anilistId: { type: [integer, "null"] }
        isMangaOnly: { type: boolean }
        lite: { type: boolean }

    Player:
      type: object
      description: Un lecteur vidéo. `id` ne sert qu'à la lecture vidéo.
      properties:
        id: { type: string, description: Jeton opaque. }
        key: { type: string, example: s1 }
        label: { type: string, example: Source A }
        rank: { type: integer, description: "Ordre de préférence, 1 en premier." }
        recommended: { type: boolean }

    Episode:
      type: object
      properties:
        number: { type: number, example: 1 }
        episode: { type: number, description: Identique à `number`. }
        title: { type: [string, "null"], example: La Cité céleste }
        description: { type: [string, "null"] }
        image: { type: [string, "null"], format: uri }
        thumbnail: { type: [string, "null"], format: uri }
        airDate: { type: [string, "null"], format: date }
        length: { type: [integer, "null"], description: Durée en minutes., example: 25 }
        rating: { type: [number, "null"], example: 7.8 }
        ratingCount: { type: [integer, "null"] }
        lecteurs:
          type: object
          description: "Lecteurs rangés par langue (`vostfr`, `vf`, `va`…), puis par nom."
          additionalProperties:
            type: object
            additionalProperties: { $ref: "#/components/schemas/Player" }

    SeasonEpisodes:
      type: object
      properties:
        episodes: { type: array, items: { $ref: "#/components/schemas/Episode" } }
        totalEpisodes: { type: integer, example: 24 }
        seasonName: { type: [string, "null"], example: Saison 1 }
        seasonDescription: { type: [string, "null"], description: "Résumé de la saison, seulement en français." }
        seasonCover: { type: [string, "null"], format: uri }
        seasonBanner: { type: [string, "null"], format: uri }
        nextEpisode:
          description: Prochain épisode attendu.
          oneOf:
            - $ref: "#/components/schemas/Episode"
            - type: "null"
        lite: { type: boolean }

    Segment:
      oneOf:
        - type: object
          properties:
            start: { type: number, example: 41.5 }
            end: { type: number, example: 131.4 }
        - type: "null"
