              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AnimePage" }
        "400": { $ref: "#/components/responses/InvalidParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

