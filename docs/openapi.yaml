openapi: 3.1.0
info:
  title: API Nartya
  version: "1.0"
  summary: Catalogue d'anime et de manga, fiches, saisons et épisodes.
  description: |
    L'API Nartya sert le catalogue d'anime et de manga, les fiches, les saisons, les épisodes
    et leurs métadonnées, en JSON. C'est l'API qu'utilise l'application Nartya ; vous pouvez
    vous en servir pour un script, un bot ou votre propre projet.

    # Démarrer

    1. Dans l'application Nartya, ouvrez **Paramètres → Clés d'API** et créez une clé. Il faut
       un compte (pas un compte invité) avec un compte Discord lié ; sur ordinateur, la liaison
       Discord se fait depuis le Hub Nartya.
    2. Copiez la clé : elle commence par `nk_` et n'est affichée qu'une seule fois.
    3. Envoyez-la dans l'en-tête `Authorization` :

    ```bash
    curl -H "Authorization: Bearer nk_votre_cle" \
      "https://anime.nartya.app/v1/anime/search?q=naruto"
    ```

    Gardez la clé côté serveur : dans le code d'une page web, n'importe quel visiteur pourrait
    la lire et l'utiliser à votre place.

    # Deux façons d'accéder

    | | Clé d'API | Session de l'application |
    | --- | --- | --- |
    | Pour qui | Un script, un bot, un projet tiers | Le développement de l'application Nartya |
    | Comment | `Authorization: Bearer nk_…` | Se connecter dans l'app, qui envoie le jeton |
    | Catalogue, fiches, épisodes, manga | Oui | Oui |
    | Lecture vidéo (`/sources/recipe`, `/streams`) | Non | Oui |
    | Actions de compte (`POST`) | Non | Oui |
    | Plafond | 60 / min | 180 / min |

    Chaque route indique, sous **Authorizations**, ce qu'elle accepte : `CleAPI`,
    `SessionApp`, ou rien pour les routes publiques. Un compte suspendu reçoit `403` partout.

    ## Clé d'API

    Une clé est rattachée à votre compte : elle en partage les limites et le bannissement, et
    cesse de fonctionner dès que vous la révoquez (une minute au plus). Elle est **en lecture
    seule** : seules les requêtes `GET` passent. Cinq clés actives au maximum par compte.

    Elle n'ouvre pas la lecture vidéo : ces routes donnent l'adresse des vidéos des
    hébergeurs, et les ouvrir à des clés permanentes ferait de l'API un résolveur de vidéos pour
    n'importe quel site. Elles restent liées à une personne connectée dans l'application.

    ## Session de l'application

    C'est l'accès de l'application elle-même, et donc celui de quiconque développe dessus.
    Depuis le dossier du code de l'application :

    ```bash
    npm install
    cp .env.example .env
    npm run electron:dev
    ```

    Connectez-vous ensuite avec votre compte Nartya : l'app appelle l'API publique avec votre
    session, et toutes les routes fonctionnent, lecture vidéo comprise. Rien à configurer :
    `.env.example` contient les valeurs publiques du projet.

    Pour appeler une route à la main avec votre session, copiez le jeton depuis la console de
    développement de l'app (`Ctrl+Maj+I`) :

    ```js
    JSON.parse(localStorage.getItem("nartya-auth")).access_token
    ```

    puis envoyez-le comme une clé : `Authorization: Bearer <jeton>`. Ce jeton expire au bout
    d'une heure (l'app le renouvelle seule) et donne accès à votre compte : ne le partagez pas,
    et préférez une clé d'API pour tout ce qui tourne en dehors de l'app.

    # Réponses

    Un succès renvoie un statut `2xx` et un objet `{ "data": …, "meta": { … } }`. `meta`
    n'apparaît que sur les listes (`count`, `page`, `query`, `fetchedAt`).

    Un échec renvoie un statut `4xx` ou `5xx` et un objet
    `{ "error": { "code": "…", "message": "…" } }`. Le message est en français et peut être
    affiché tel quel ; pour décider quoi faire, fiez-vous à `code`.

    | Statut | `code` | Quand |
    | --- | --- | --- |
    | 400 | `invalid_param` | Paramètre absent ou mal formé |
    | 401 | `unauthorized` | Jeton absent ou invalide, clé révoquée |
    | 403 | `forbidden` | Compte suspendu, ou action interdite à une clé |
    | 404 | `not_found` | Anime, saison, genre ou profil inconnu |
    | 410 | `expired` | Jeton de lecture périmé |
    | 429 | `rate_limited` | Trop de requêtes |
    | 500 | `internal` | Erreur du serveur |
    | 502 | `upstream_error` | Un service tiers n'a pas répondu |
    | 503 | `unavailable` | Filtre ou service momentanément indisponible |

    # Limites

    Les plafonds sont comptés par compte, sur une minute glissante.

    | Quoi | Plafond |
    | --- | --- |
    | Toutes les routes, avec une clé d'API | 60 / min |
    | Toutes les routes, depuis l'application | 180 / min |
    | `/anime/search` et `/anime/{slug}/episodes` | 20 / min en plus |
    | Un `slug` absent du catalogue | 10 / min |
    | Images de manga | 600 / min |

    Les en-têtes `RateLimit-Limit`, `RateLimit-Remaining` et `RateLimit-Reset` indiquent où
    vous en êtes. Au-delà, l'API répond `429` : attendez la fin de la fenêtre avant de
    réessayer. La plupart des réponses sont en cache côté serveur ; si vous interrogez souvent
    les mêmes fiches, gardez-les aussi en cache de votre côté.

    # Identifiants

    | Nom | Description |
    | --- | --- |
    | `slug` | Identifiant d'un anime, par exemple `one-piece`. Lettres, chiffres, `.`, `_` et `-`, 100 caractères au plus. |
    | `seasonId` | Saison au sein d'un anime : `saison1`, `saison2-1`, `film`, `oav`… Se lit dans `/anime/{slug}/seasons`. |
    | `oeuvre` | Nom d'une œuvre de manga, tel que renvoyé par l'API. Les espaces finaux comptent : passez la valeur telle quelle, encodée pour l'URL. |
    | `page` | Entier à partir de 1, plafonné à 200. |
  contact:
    name: NartyaTeam
    url: https://nartya.app
  x-logo:
    url: https://nartya.app/assets/hub.png
    altText: Nartya
    href: https://nartya.app

servers:
  - url: https://anime.nartya.app/v1

security:
  - CleAPI: []
  - SessionApp: []

tags:
  - name: État
    description: Disponibilité du service.
  - name: Accueil
    description: Contenu éditorialisé de l'accueil de l'application.
  - name: Anime
    description: Recherche et navigation dans le catalogue.
  - name: Fiche
    description: Informations détaillées sur un anime.
  - name: Épisodes
    description: Saisons, épisodes et moments à sauter.
  - name: Manga
    description: Catalogue manga, chapitres et pages.
  - name: Lecture vidéo
    description: |
      Réservé à la session de l'application : une clé d'API reçoit `403` sur ces routes. Elles
      donnent l'adresse des vidéos des hébergeurs ; les réserver à une personne connectée dans
      l'app évite que l'API serve de résolveur à d'autres sites.
  - name: Compte
    description: |
      Routes qui écrivent. Une clé d'API étant en lecture seule, elles demandent la session de
      l'application, sauf le comptage des vues de profil, public.

x-tagGroups:
  - name: Catalogue
    tags: [Accueil, Anime, Fiche, Épisodes, Manga]
  - name: Service
    tags: [État, Lecture vidéo, Compte]

paths:
  /health:
    get:
      tags: [État]
      operationId: getHealth
      summary: Santé du service
      description: |
        `ready` passe à `true` une fois le cache chargé, quelques secondes après un
        redémarrage.
      security: []
      responses:
        "200":
          description: Le service répond.
          content:
            application/json:
              example: {"data":{"service":"nartya-api","ready":false}}
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      service: { type: string, example: nartya-api }
                      ready: { type: boolean }

  /status:
    get:
      tags: [État]
      operationId: getStatus
      summary: État des services
      description: État des services dont dépend l'API (catalogue, métadonnées, base).
      security: []
      responses:
        "200":
          description: État de chaque service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checkedAt: { type: string, format: date-time }
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            label: { type: string }
                            category: { type: string, example: core }
                            ok: { type: boolean }
                            ms: { type: [integer, "null"], description: "Temps de réponse, en millisecondes." }
                            detail: { type: [string, "null"] }

  /home:
    get:
      tags: [Accueil]
      operationId: getHome
      summary: Accueil
      description: |
        `hero` (mise en avant), `rows` (rangées thématiques) et `spotlight`.
      responses:
        "200":
          description: Contenu de l'accueil.
          content:
            application/json:
              example: {"data":{"hero":[{"id":189046,"slug":"re-zero","title":"Re:Zero kara Hajimeru Isekai Seikatsu 4th Season","titleNative":"Re:ゼロから始める異世界生活 4th season","titles":["Re:Zero kara Hajimeru Isekai Seikatsu 4th Season","Re:ZERO -Starting Life in Another World- Season 4"],"cover":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx189046-yaHWtS5FII46.jpg","color":"#e49350","banner":"https://s4.anilist.co/file/anilistcdn/media/anime/banner/189046-MDk2CaVuRWpb.jpg","genres":["Action","Adventure"],"score":9,"description":"In the deadly battle at Priestella, Subaru and his allies emerged victorious, but at great cost. As Subaru searches for a way to save Rem, Crusch, and Julius…","format":"TV","status":"FINISHED","countryOfOrigin":"JP","episodes":19,"chapters":null,"volumes":null,"year":2026,"nextEpisode":null,"fanart":"https://artworks.thetvdb.com/banners/fanart/original/305089-1.jpg","clearLogo":"https://artworks.thetvdb.com/banners/v4/series/305089/clearlogo/611be52a428ea.png","azBanner":"https://artworks.thetvdb.com/banners/graphical/305089-g.jpg"}],"rows":[{"key":"trending","title":"Tendances","kana":"人気","numbered":true,"items":[{"id":189046,"slug":"re-zero","title":"Re:Zero kara Hajimeru Isekai Seikatsu 4th Season","titleNative":"Re:ゼロから始める異世界生活 4th season","titles":["Re:Zero kara Hajimeru Isekai Seikatsu 4th Season","Re:ZERO -Starting Life in Another World- Season 4"],"cover":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx189046-yaHWtS5FII46.jpg","color":"#e49350","banner":"https://s4.anilist.co/file/anilistcdn/media/anime/banner/189046-MDk2CaVuRWpb.jpg","genres":["Action","Adventure"],"score":9,"description":"In the deadly battle at Priestella, Subaru and his allies emerged victorious, but at great cost. As Subaru searches for a way to save Rem, Crusch, and Julius…","format":"TV","status":"FINISHED","countryOfOrigin":"JP","episodes":19,"chapters":null,"volumes":null,"year":2026,"nextEpisode":null}]}],"spotlight":[{"id":20,"slug":"naruto","title":"NARUTO","titleNative":"NARUTO -ナルト-","titles":["NARUTO","Naruto"],"cover":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20-dE6UHbFFg1A5.jpg","color":"#e47850","banner":"https://s4.anilist.co/file/anilistcdn/media/anime/banner/20-HHxhPj5JD13a.jpg","genres":["Action","Adventure"],"score":8,"description":"Naruto Uzumaki, a hyperactive and knuckle-headed ninja, lives in Konohagakure, the Hidden Leaf village. Moments prior to his birth, a huge demon known as the…","format":"TV","status":"FINISHED","countryOfOrigin":"JP","episodes":220,"chapters":null,"volumes":null,"year":2002,"nextEpisode":null,"fanart":"https://artworks.thetvdb.com/banners/fanart/original/78857-18.jpg","clearLogo":"https://artworks.thetvdb.com/banners/v4/series/78857/clearlogo/611b6a908fa9d.png","azBanner":"https://artworks.thetvdb.com/banners/graphical/78857-g3.jpg"}]}}
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hero: { type: array, items: { $ref: "#/components/schemas/MediaCard" } }
                      rows: { type: array, items: { $ref: "#/components/schemas/Row" } }
                      spotlight: { type: array, items: { $ref: "#/components/schemas/MediaCard" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /home/for-you:
    get:
      tags: [Accueil]
      operationId: getForYou
      summary: Recommandations personnalisées
      description: |
        Rangée « Parce que tu as regardé… » calculée à partir d'animes déjà vus. `data` vaut
        `null` s'il n'y a rien de pertinent.
      parameters:
        - name: slugs
          in: query
          required: true
          description: Slugs déjà vus, séparés par des virgules, du plus récent au plus ancien (8 au plus).
          schema: { type: string, example: "gachiakuta,one-piece" }
      responses:
        "200":
          description: La rangée, ou `null`.
          content:
            application/json:
              example: {"data":{"key":"for-you","title":"Parce que tu as regardé Gachiakuta","kana":"為","items":[{"id":3588,"slug":"soul-eater","title":"Soul Eater","titleNative":"ソウルイーター","titles":["Soul Eater","ソウルイーター"],"cover":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx3588-fSMggQoFSbUI.png","color":"#e4bb5d","banner":"https://s4.anilist.co/file/anilistcdn/media/anime/banner/3588-rpnVOMaLD3is.jpg","genres":["Action","Adventure"],"score":7.7,"description":"Set in the Shinigami technical school for weapon meisters, the series revolves around 3 groups of each a weapon meister and a human weapon. Trying to make th…","format":"TV","status":"FINISHED","countryOfOrigin":"JP","episodes":51,"chapters":null,"volumes":null,"year":2008,"nextEpisode":null},{"id":105310,"slug":"fire-force","title":"Enen no Shouboutai","titleNative":"炎炎ノ消防隊","titles":["Enen no Shouboutai","Fire Force"],"cover":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx105310-2PKUvoaA6fTn.jpg","color":"#f1bb28","banner":"https://s4.anilist.co/file/anilistcdn/media/anime/banner/105310-ygGL9yweZM2Q.jpg","genres":["Action","Drama"],"score":7.6,"description":"Year 198 of the Solar Era in Tokyo, special fire brigades are fighting against a phenomenon called spontaneous human combustion where human beings are turned…","format":"TV","status":"FINISHED","countryOfOrigin":"JP","episodes":24,"chapters":null,"volumes":null,"year":2019,"nextEpisode":null}]}}
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Row"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /anime/catalog:
    get:
      tags: [Anime]
      operationId: getAnimeCatalog
      summary: Catalogue filtré
      description: |
        Recherche filtrée dans le catalogue, une trentaine de résultats par page. Les filtres
        `epMin`, `epMax` et `lang` demandent la base de données : si elle est indisponible, la
        route répond `503` plutôt que d'ignorer le filtre.
      parameters:
        - { name: search, in: query, description: Texte cherché dans le titre (100 caractères au plus)., schema: { type: string } }
        - { name: genre, in: query, description: "Genres séparés par des virgules (8 au plus), tous requis.", schema: { type: string, example: "Action,Comédie" } }
        - { name: type, in: query, description: Type de contenu., schema: { type: string, example: Anime } }
        - { name: epMin, in: query, description: Nombre d'épisodes minimal., schema: { type: integer, minimum: 0 } }
        - { name: epMax, in: query, description: Nombre d'épisodes maximal., schema: { type: integer, minimum: 0 } }
        - { name: lang, in: query, description: Langue disponible., schema: { type: string, enum: [vf, vostfr, va] } }
        - { name: verified, in: query, description: Ne garder que les fiches reliées à AniList., schema: { type: boolean } }
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: Une page de résultats.
          content:
            application/json:
              example: {"data":[{"slug":"zombie-sagashitemasu","title":"#Zombie Sagashitemasu","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/zombie-sagashitemasu.webp","episodeCount":0,"anilistId":null,"genres":["Action","Aventure"],"type":"Anime","languages":["vostfr"]},{"slug":"07-ghost","title":"07 Ghost","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/07-ghost.webp","episodeCount":25,"anilistId":null,"genres":["Action","Aventure"],"type":"Anime","languages":["vostfr"]},{"slug":"29-sai-dokushin-chuuken-boukensha-no-nichijou","title":"29-Sai Dokushin Chuuken Boukensha no Nichijou","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/29-sai-dokushin-chuuken-boukensha-no-nichijou.webp","episodeCount":12,"anilistId":192261,"genres":["Action","Aventure"],"type":"Anime","languages":["vostfr"]}],"meta":{"count":36,"page":1}}
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /anime/search:
    get:
      tags: [Anime]
      operationId: searchAnime
      summary: Recherche par titre
      description: Plafond dédié de 20 requêtes par minute.
      parameters:
        - { name: q, in: query, required: true, description: Texte recherché (100 caractères au plus)., schema: { type: string, example: naruto } }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Résultats.
          content:
            application/json:
              example: {"data":[{"slug":"naruto","title":"Naruto  ","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/naruto.webp"},{"slug":"naruto-shippuden","title":"Naruto Shippuden","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/naruto-shippuden.webp"},{"slug":"naruto-sd-rock-lee","title":"Naruto SD Rock Lee","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/naruto-sd-rock-lee.webp"}],"meta":{"query":"naruto","count":3}}
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TitleCard" } }
                  meta:
                    type: object
                    properties:
                      query: { type: string }
                      count: { type: integer }
        "400": { $ref: "#/components/responses/InvalidParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /anime/planning:
    get:
      tags: [Anime]
      operationId: getPlanning
      summary: Planning de la semaine
      description: Sorties de la semaine, jour par jour.
      responses:
        "200":
          description: Les sept jours.
          content:
            application/json:
              example: {"data":[{"index":0,"name":"Lundi","date":"28/09","items":[{"slug":"bleach","season":"saison2-4","seasonLabel":null,"langs":["vostfr"],"title":"Bleach TYBW","image":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx185874-aU3e6tBT6wwA.jpg","type":"Anime","time":"17h30","status":"Partie 4","color":null},{"slug":"liar-game","season":"saison1","seasonLabel":"Saison 1","langs":["vostfr"],"title":"Liar Game","image":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx197754-Q5KqcUhIdypp.png","type":"Anime","time":"18h30","status":null,"color":null}]}],"meta":{"fetchedAt":1790946491470}}
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer, description: "0 pour lundi." }
                        name: { type: string, example: Lundi }
                        date: { type: string, example: "28/09" }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              slug: { type: string, example: bleach }
                              season: { type: string, example: saison2-4 }
                              seasonLabel: { type: [string, "null"] }
                              title: { type: string, example: Bleach TYBW }
                              langs: { type: array, items: { type: string }, example: [vostfr] }
                              time: { type: string, example: 17h30 }
                              image: { type: string, format: uri }
                              type: { type: string, example: Anime }
                              status: { type: [string, "null"], example: Partie 4 }
                              color: { type: [string, "null"], description: Teinte dominante de l'affiche. }
                  meta:
                    type: object
                    properties:
                      fetchedAt: { type: integer, description: Horodatage en millisecondes. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /anime/genres:
    get:
      tags: [Anime]
      operationId: getGenres
      summary: Genres populaires
      description: Genres populaires, avec une image représentative.
      responses:
        "200":
          description: Les genres.
          content:
            application/json:
              example: {"data":[{"genre":"Action","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/86-eighty-six1.webp","slug":"86-eighty-six"},{"genre":"Aventure","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/29-sai-dokushin-chuuken-boukensha-no-nichijou.webp","slug":"29-sai-dokushin-chuuken-boukensha-no-nichijou"},{"genre":"Comédie","image":"https://cdn.jsdelivr.net/gh/Anime-Sama/IMG@img/contenu/thumb/a-centaurs-life0.webp","slug":"a-centaurs-life"}],"meta":{"count":12}}
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        genre: { type: string, example: Action }
                        image: { type: string, format: uri }
                        slug: { type: string, description: Anime dont vient l'image., example: 86-eighty-six }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /anime/genres/{genre}:
    get:
      tags: [Anime]
      operationId: getAnimeByGenre
      summary: Animes d'un genre
      parameters:
        - { name: genre, in: path, required: true, schema: { type: string, example: Action } }
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: Une page d'animes.
          content:
            application/json:
