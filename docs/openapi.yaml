  /anime/{slug}/seasons/{seasonId}/episodes:
    get:
      tags: [Épisodes]
      operationId: getSeasonEpisodes
      summary: Épisodes d'une saison
      description: |
        Titres, résumés en français quand ils existent, vignettes, dates de diffusion et notes.
        `lite=1` ne garde que la numérotation et les lecteurs.

        - `number` peut ne pas commencer à 1 : certaines saisons reprennent la numérotation de la série.
        - `lecteurs` est rangé par langue. Chaque lecteur expose un `id` opaque, à échanger contre l'adresse de la vidéo avec `/streams/{id}` (session de l'application).
        - `seasonDescription` n'est renseigné que si un résumé en français existe.
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/seasonId"
        - { name: lite, in: query, description: "`1` pour une liste allégée.", schema: { type: integer, enum: [1] } }
      responses:
        "200":
          description: Les épisodes de la saison.
          content:
            application/json:
              example: {"data":{"episodes":[{"episode":1,"lecteurs":{"vostfr":{"eps2":{"id":"AbC9…","key":"s1","label":"Source A","rank":10,"recommended":true}},"vf":{"eps2":{"id":"AbC9…","key":"s1","label":"Source A","rank":10,"recommended":true}}},"number":1,"title":"La Cité céleste","description":"Rudo vit avec Regto, son père adoptif, près de la Cité céleste.","image":"https://artworks.thetvdb.com/banners/v4/episode/10541264/screencap/68635e8960c74.jpg","thumbnail":"https://artworks.thetvdb.com/banners/v4/episode/10541264/screencap/68635e8960c74.jpg","airDate":"2025-07-06","length":25,"rating":7.8,"ratingCount":26},{"episode":2,"lecteurs":{"vostfr":{"eps2":{"id":"AbC9…","key":"s1","label":"Source A","rank":10,"recommended":true}},"vf":{"eps2":{"id":"AbC9…","key":"s1","label":"Source A","rank":10,"recommended":true}}},"number":2,"title":"Réceptacles","description":"Jeté dans la Fosse par les Apôtres, Rudo découvre les Composites.","image":"https://artworks.thetvdb.com/banners/v4/episode/11180307/screencap/686fa690ebef0.jpg","thumbnail":"https://artworks.thetvdb.com/banners/v4/episode/11180307/screencap/686fa690ebef0.jpg","airDate":"2025-07-13","length":25,"rating":7.5,"ratingCount":21}],"totalEpisodes":24,"seasonName":"Saison 1","nextEpisode":null,"seasonCover":"https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx178025-cWJKEsZynkil.jpg","seasonBanner":"https://s4.anilist.co/file/anilistcdn/media/anime/banner/178025-WvcXi1J2SGRa.jpg","seasonDescription":null,"lite":false}}
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SeasonEpisodes" }
        "400": { $ref: "#/components/responses/InvalidParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /anime/{slug}/seasons/{seasonId}/episodes/{number}/skip:
    get:
      tags: [Épisodes]
      operationId: getSkipSegments
      summary: Moments à sauter
      description: |
        Générique de début et de fin d'un épisode, en secondes. Chaque valeur peut être `null`,
        et `data` aussi si rien n'est connu.
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/seasonId"
        - { name: number, in: path, required: true, description: Numéro de l'épisode., schema: { type: integer, minimum: 1, example: 1 } }
      responses:
        "200":
          description: Les segments.
          content:
            application/json:
              example: {"data":{"intro":{"start":41.5,"end":131.4},"outro":{"start":1329,"end":1418}}}
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        properties:
                          intro: { $ref: "#/components/schemas/Segment" }
                          outro: { $ref: "#/components/schemas/Segment" }
                      - type: "null"
        "400": { $ref: "#/components/responses/InvalidParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

