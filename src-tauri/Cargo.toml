[package]
name = "nartya"
version = "1.40.1"
description = "Application de streaming d'anime"
authors = ["NartyaTeam"]
edition = "2021"
rust-version = "1.80"
license = "ISC"

[lib]
name = "nartya_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = "0.8"
notify = "8"
urlencoding = "2"
serde_json = "1"
url = "2"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
netdev = "0.36"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
