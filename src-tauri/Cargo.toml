[package]
name = "nartya"
version = "1.40.1"
description = "Application de streaming d'anime"
authors = ["NartyaTeam"]
edition = "2021"
rust-version = "1.80"
license = "ISC"

[lib]
name = "nartya_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }
axum = "0.8"
notify = "8"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "json"] }
futures-util = "0.3"
bytes = "1"
regex = "1"
rand = "0.9"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
netdev = "0.36"
tokio-util = { version = "0.7.19", features = ["io"] }
tauri-plugin-dialog = "2.7.3"
mdns-sd = { version = "0.21.7", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
