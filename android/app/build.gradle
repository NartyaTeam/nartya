import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Keystore local, jamais commité. Absent, l'APK release reste non signé.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseSigning = keystorePropsFile.exists()
if (hasReleaseSigning) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Indépendante du desktop. Le versionCode reste strictement croissant, même si le versionName
// repart à 1.0.0 ; 12800 succède aux premières APK de validation.
def androidVersionMetadata = new JsonSlurper().parse(rootProject.file('version.json'))
def androidVersionName = androidVersionMetadata.versionName as String
def androidVersionCode = androidVersionMetadata.versionCode as Integer
def nartyaProxyProbe = project.findProperty('nartyaProxyProbe') == 'true'
if (!(androidVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("versionName Android invalide dans android/version.json: ${androidVersionName}")
}
if (androidVersionCode < 12800 || androidVersionCode > 2100000000) {
    throw new GradleException("versionCode Android invalide dans android/version.json: ${androidVersionCode}")
}

android {
    namespace = "com.nartya.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nartya.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersionName
        // `-PnartyaProxyProbe=true` : sonde Java contre l'APK release minifié, sans AndroidX/JUnit.
        testInstrumentationRunner nartyaProxyProbe
                ? "com.nartya.app.proxy.NartyaProxyProbeInstrumentation"
                : "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Cœur Rust (crates/nartya-android -> libnartya_android.so), compilé par cargo-ndk.
//   -PnartyaCore=true   compile, échoue si cargo-ndk manque
//   -PnartyaCore=false  ne compile pas
//   (défaut) compile si cargo-ndk est installé ; sans bibliothèque, la page reste sur le proxy Java
//   -PnartyaCoreAbis=x86_64   autres ABI, séparées par des virgules (émulateur)
def nartyaCoreMode = (project.findProperty('nartyaCore') ?: 'auto') as String
def nartyaCoreAbis = ((project.findProperty('nartyaCoreAbis') ?: 'arm64-v8a,armeabi-v7a') as String).split(',')
def hasCargoNdk = {
    try {
        def process = new ProcessBuilder('cargo', 'ndk', '--version').redirectErrorStream(true).start()
        process.inputStream.text
        return process.waitFor() == 0
    } catch (Exception ignored) {
        return false
    }
}

tasks.register('buildNartyaCore', Exec) {
    group = 'build'
    description = 'Compile le coeur Rust pour Android (cargo-ndk).'
    onlyIf {
        if (nartyaCoreMode == 'false') return false
        if (hasCargoNdk()) return true
        if (nartyaCoreMode == 'true') throw new GradleException('cargo-ndk introuvable (cargo install cargo-ndk)')
        logger.warn("cargo-ndk absent : coeur Rust non compile, lecture par le proxy Java")
        return false
    }
    workingDir rootProject.projectDir.parentFile
    def args = ['cargo', 'ndk']
    nartyaCoreAbis.each { abi -> args += ['-t', abi.trim()] }
    args += ['-P', rootProject.ext.minSdkVersion.toString(), '-o', file('src/main/jniLibs').absolutePath,
             'build', '-p', 'nartya-android', '--release']
    commandLine args
}

tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'buildNartyaCore' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
