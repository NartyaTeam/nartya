[package]
name = "nartya-core"
version = "1.41.1"
description = "Cœur de Nartya : proxy local, résolution des flux, téléchargements, Cast, Discord, session partagée"
authors = ["NartyaTeam"]
edition = "2021"
rust-version = "1.80"
license = "ISC"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }
axum = "0.8"
notify = "8"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "json"] }
futures-util = "0.3"
bytes = "1"
regex = "1"
rand = "0.9"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
url = "2"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
netdev = "0.36"
tokio-util = { version = "0.7.19", features = ["io"] }
mdns-sd = { version = "0.21.7", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
