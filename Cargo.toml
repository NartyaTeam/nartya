# Le cœur de Nartya (`crates/nartya-core`) ne dépend d'aucune coque : chaque plateforme
# (`src-tauri` aujourd'hui) l'embarque et n'implémente que ce qui lui est propre.
[workspace]
resolver = "2"
members = ["crates/nartya-core", "src-tauri"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
